[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hmm-viewer"
version = "0.1.3"
description = "View CSV, Parquet files and pandas/polars DataFrames in a terminal UI"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "Stephen Sun" }]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/suntianxun/hmm"
Repository = "https://github.com/suntianxun/hmm"

[project.optional-dependencies]
pandas = ["pandas", "pyarrow"]
polars = ["polars"]

[project.scripts]
hmm = "hmm_viewer.cli:main"
